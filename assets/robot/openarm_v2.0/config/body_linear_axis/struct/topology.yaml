links:
  - body_link0
  - linear_axis_base_link
  - linear_axis_middle_link
  - linear_axis_upper_link
  - linear_axis_top_plate_link
  - chest_link0

joints:
  body_linear_axis_base_joint:
    type: fixed
    parent: body_link0
    child: linear_axis_base_link
    origin: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

  linear_axis_joint:
    type: prismatic
    parent: linear_axis_base_link
    child: linear_axis_middle_link
    origin: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
    axis: {x: 0.0, y: 0.0, z: 1.0}
    limit:
      lower: 0.0
      upper: 0.6
      effort: 10000.0
      velocity: 0.1
    dynamics:
      damping: 50.0
      friction: 0.0

  linear_axis_middle_upper_joint:
    type: fixed
    parent: linear_axis_middle_link
    child: linear_axis_upper_link
    origin: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

  linear_axis_upper_top_plate_joint:
    type: fixed
    parent: linear_axis_upper_link
    child: linear_axis_top_plate_link
    origin: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

  linear_axis_top_plate_chest_joint:
    type: fixed
    parent: linear_axis_top_plate_link
    child: chest_link0
    # Chest collision bottom: 0.613 m. Plate top: 0.584 m.
    origin: {x: 0.0, y: 0.0, z: -0.029, roll: 0.0, pitch: 0.0, yaw: 0.0}
